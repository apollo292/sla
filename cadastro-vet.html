<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cadastro-vet.css">
</head>
<body>
    <form id="cadastro_vet">
        <div class="input-grupo">
            <label>Nome</label>
            <input type="text" name="nome" id="nome" placeholder="Digite o nome">
        </div>

        <div class="input-grupo">
            <label>CFMV</label>
            <input type="text" name="cfmv" id="cfmv" placeholder="Digite o cfmv">
        </div>

        <div class="input-grupo">
            <label>Especialidade</label>
            <input type="text" name="especialidade" id="especialidade" placeholder="Digite a Especialidade">
        </div>

        <button type="button" class="btn-submit">Salvar</button>
    </form>

    <script src="cadastro-vet.js"></script>
</body>
</html>
