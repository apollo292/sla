<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro de Pet🐶</h1>

    <br>

    <div id="container">
        <div id="caixa_dono"> 
            <label>Nome do Tutor</label>
            <input placeholder="Digite o Nome do Tutor:" id="nome_tutor">
        </div>
        <br>
        <div id="caixa_pet">
            <label>Nome do Pet</label>
            <input placeholder="Digite o Nome do Seu Pet:" id="nome_pet">
        </div>
        <br>
        <div id="caixa_raca">
            <label>Raça do Pet</label>
            <input placeholder="Digite a Raça do Animal:" id="raca">
        </div>
       <br>
        <div id="caixa_genero">
            <label>Gênero do Pet</label>
            <select id="genero">
                <option>Macho</option>
                <option>Fêmea</option>
            </select>
        </div>
        <br>
        <div id="caixa_peso">
            <label>Peso do Pet</label>
            <input placeholder="Digite o Peso do Animal:" id="peso" type="number">
        </div>
        <br>
        <div id="caixa_idade">
            <label>Idade do Pet</label>
            <input placeholder="Digite a Idade do Animal:" id="idade" type="number">
        </div>
        <br>
        <button id="botao">Concluir</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
